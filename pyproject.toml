[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HANN"
version = "0.1.0"
description = "HANN motor network simulation and analysis"
requires-python = ">=3.10,<3.13"
dependencies = [
  "brainpy==2.7.6",
  "jax==0.6.2",
  "jaxlib==0.6.2",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "numba>=0.58",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["HANN*"]
